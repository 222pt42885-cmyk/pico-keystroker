name: ci

# Host-only: gcc/make/gcovr, `make test` + `make coverage`.
# No cross-compilers needed, so this stays fast on every PR.
on:
  pull_request: {}
  push: {}

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make gcovr

      - name: Unit tests
        run: make test

      - name: Coverage (>=90% enforced by Makefile)
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  # --- ESP32-S3 target: PlatformIO/Arduino USB-OTG HID -> firmware.bin ---
  esp32s3-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('targets/esp32s3/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Link shared core + build
        run: |
          ln -s ../../src/common targets/esp32s3/common
          pio run -d targets/esp32s3 -e esp32s3-zero
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: fw-esp32s3
          path: targets/esp32s3/.pio/build/esp32s3-zero/firmware.bin
          if-no-files-found: error
