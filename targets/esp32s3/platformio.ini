; ESP32-S3 USB-HID keystroker — PlatformIO project. Run `pio run` here.
; First share the common core (symlink; on Windows copy the dir instead):
;   ln -s ../../src/common common
;
; USB STACK: Arduino-ESP32 native USB-OTG (TinyUSB device mode). The two
; -D flags below are REQUIRED: the S3 Arduino default is
; ARDUINO_USB_MODE=1 (Hardware CDC + JTAG, no TinyUSB device), in which
; mode USBHIDKeyboard cannot enumerate. Forcing MODE=0 selects
; "USB-OTG (TinyUSB)" and CDC_ON_BOOT=0 keeps `Serial` on UART0
; (GPIO43/44) for debug instead of USB-CDC. `build_unflags` strips the
; core defaults first so the override wins.
; No lib_deps: USBHIDKeyboard/USB ship with the Arduino-ESP32 core.
;
; FIRST FLASH: most S3 boards enumerate the ROM USB-DFU bootloader only
; while BOOT is held at reset. Hold BOOT (GPIO0), tap RESET, release
; BOOT, then `pio run -e esp32s3-zero -t upload`. Later flashes can use
; the normal USB upload. If the board has no RESET button, hold BOOT
; while unplugging/replugging USB.
;
; ARTIFACTS: .pio/build/esp32s3-zero/firmware.bin (+ bootloader.bin,
; partitions.bin) — NOT .uf2. UF2 is Raspberry-Pi-bootrom-only; ESP32-S3
; flashes raw .bin images via esptool (see targets/README.md).
[platformio]
src_dir = .

[env:esp32s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 4MB
upload_protocol = esptool
monitor_speed = 115200
build_flags =
  -I .
  -I ./common
  -D BOARD_ESP32S3_ZERO
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
build_unflags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
src_filter =
  +<*.cpp>
  +<*.c>
  +<common/*.c>
