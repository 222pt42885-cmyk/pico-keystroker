; ESP32-C3 Super Mini STUB — PlatformIO project. Run `pio run` here.
; First share the common core (symlink; on Windows copy the dir instead):
;   ln -s ../../src/common common
; NOTE: C3 has USB-Serial/JTAG ONLY — USB-HID is impossible (see README.md).
; This builds a console-logging stub, not a keyboard.
[platformio]
src_dir = .

[env:super-mini-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_protocol = esptool
monitor_speed = 115200
build_flags =
  -I .
  -I ./common
  -D BOARD_ESP32C3_STUB
src_filter = +<*.cpp> +<common/*.c>
