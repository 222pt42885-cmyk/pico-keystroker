; STM32 Mini F401 — PlatformIO project. Run `pio run` from this directory.
; First share the common core (symlink; on Windows copy the dir instead):
;   ln -s ../../src/common common
[platformio]
src_dir = .

[env:stm32f401_mini]
platform = ststm32
board = genericSTM32F401CC
framework = arduino
board_build.f_cpu = 84000000L
; Built-in USB DFU (BOOT0=1 + reset). Alternative: upload_protocol = stlink
upload_protocol = dfu
build_flags =
  -I .
  -I ./common
  -D BOARD_MINI_F401
src_filter = +<*.c> +<common/*.c>
; TinyUSB device stack (synopsys STM32 FS driver). Baremetal alternative:
; STM32Cube USB Device lib — then drop lib_deps and adapt hal_port.c.
lib_deps =
  adafruit/Adafruit TinyUSB Library
; Artifacts: .pio/build/stm32f401_mini/firmware.{bin,hex,dfu}
; (NOT .uf2 — UF2 is Pi-bootrom-only; see targets/README.md).
