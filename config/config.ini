# Arboard pico-keystroker -- sample configuration.
# Lines starting with '#' or ';' are comments. Keys are case-insensitive.

[device]

# Trigger mode: "button" waits for a button press, "time" waits COUNTDOWN_MS
# after USB mount and then types automatically. WRITE_MODE is required.
WRITE_MODE = time

# Delay before auto-typing in time mode (ms). Required in time mode,
# ignored in button mode. Range: 1..3600000.
COUNTDOWN_MS = 5000

# USB HID keyboard name shown to the host.
HID_KEYBOARD_NAME = Arboard-2040-pico-keystroker

# Keyboard layout for the HID keymap: en_US | tr_TR | de_DE | fr_FR.
LANGUAGE = en_US

# A second press within this window after a press is dropped (ms).
DOUBLE_CLICK_MS = 400

# Button input must be stable this long to count as pressed (ms).
DEBOUNCE_MS = 30

# GPIO number of the trigger button (0..29 on RP2040).
BUTTON_PIN = 15

# Delay between emitted HID actions while typing (ms).
TYPING_DELAY_MS = 8
